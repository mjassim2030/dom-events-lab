<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Events Lab</title>
    <script defer src="./app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="calculator">
      <div class="row">
        <div class="display"></div>
      </div>
      <div class="row">
        <div class="button number">7</div>
        <div class="button number">8</div>
        <div class="button number">9</div>
        <div class="button operator">/</div>
      </div>
      <div class="row">
        <div class="button number">4</div>
        <div class="button number">5</div>
        <div class="button number">6</div>
        <div class="button operator">*</div>
      </div>
      <div class="row">
        <div class="button number">1</div>
        <div class="button number">2</div>
        <div class="button number">3</div>
        <div class="button operator">-</div>
      </div>
      <div class="row">
        <div class="button operator">C</div>
        <div class="button number">0</div>
        <div class="button equals">=</div>
        <div class="button operator">+</div>
      </div>

      <h3 style="text-align: center;">Basic Calculator (MVP)</h3>
    </div>

    <div id="newCalculator">
        <div class="row">
          <div class="newDisplay"></div>
        </div>
        <div class="row">
          <div class="newButton number">7</div>
          <div class="newButton number">8</div>
          <div class="newButton number">9</div>
          <div class="newButton operator">/</div>
        </div>
        <div class="row">
          <div class="newButton number">4</div>
          <div class="newButton number">5</div>
          <div class="newButton number">6</div>
          <div class="newButton operator">*</div>
        </div>
        <div class="row">
          <div class="newButton number">1</div>
          <div class="newButton number">2</div>
          <div class="newButton number">3</div>
          <div class="newButton operator">-</div>
        </div>
        <div class="row">
          <div class="newButton operator">C</div>
          <div class="newButton number">0</div>
          <div class="newButton equals">=</div>
          <div class="newButton operator">+</div>
        </div>
        <h3 style="text-align: center;">Enhanced Calculator</h3>

      </div>

      
  </body>
</html>
